<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EduConnect - Iniciar Sesión</title>

    <link rel="stylesheet" href="./css/IniciarSesion.css">
    <link rel="icon" type="image/png" href="./imagenes/icono4.png">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

    <h1>Entrar a EduConnect Tu sitio de confianza</h1>

    <form id="formLogin">

        <section>
            <label for="email">Usuario / Email</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="ejemplo@cen.edu.ar"
                required
                autocomplete="email">
        </section>

        <section class="form2">
            <label for="password">Contraseña</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="••••••"
                required
                autocomplete="current-password">
        </section>

        <button type="submit" id="btnLogin">
            Iniciar Sesion
        </button>

    </form>

    <p class="link-text">
        ¿No tienes cuenta?
        <a href="crear_cuenta.html" class="link">Regístrate aquí</a>
    </p>

    <script>

        // CONFIGURACIÓN SUPABASE
        const SUPABASE_URL = 'https://fudtngwtdvziowrbamyp.supabase.co';

        const SUPABASE_ANON_KEY = 'sb_publishable_PStPebFMSazini9S3539ng_D6bT3Dj0';

        const supabaseClient = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_ANON_KEY
        );

        // ELEMENTOS DEL FORMULARIO
        const form = document.getElementById('formLogin');
        const boton = document.getElementById('btnLogin');

        // INICIAR SESIÓN
        form.addEventListener('submit', async function(event) {

            event.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            boton.disabled = true;
            boton.textContent = 'Ingresando...';

            try {

                // 1. AUTENTICAR USUARIO
                const { data: authData, error: authError } =
                    await supabase.auth.signInWithPassword({
                        email: email,
                        password: password
                    });

                if (authError) {
                    throw new Error('Error de inicio de sesión: ' + authError.message);
                }

                console.log('Usuario autenticado:', authData.user.id);

                // 2. BUSCAR PERFIL
                const { data: perfil, error: perfilError } = await supabase
                    .from('perfiles')
                    .select('rol')
                    .eq('id', authData.user.id)
                    .single();

                if (perfilError) {
                    throw new Error('Error al buscar el perfil: ' + perfilError.message);
                }

                console.log('Perfil encontrado:', perfil);

                // 3. VERIFICAR ROL Y REDIRIGIR
                let destino = '';

                if (perfil.rol === 'estudiante' || perfil.rol === 'alumno') {

                    destino = '/Interfaz_Menu.html';

                } else if (perfil.rol === 'profesor') {

                    destino = '/maestro/interfaz_menu.html';

                } else if (perfil.rol === 'preceptor') {

                    destino = '/Preceptor/interfaz_menu.html';

                } else {

                    throw new Error('Tu cuenta no tiene un rol válido asignado.');

                }

                console.log('Destino:', destino);

                // 4. REDIRECCIONAR
                window.location.assign(destino);

            } catch (error) {

                console.error('ERROR:', error);

                alert(error.message);

                boton.disabled = false;
                boton.textContent = 'Iniciar Sesion';

            }

        });

    </script>

</body>
</html>
