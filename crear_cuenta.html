
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/crear_cuenta.css">
    
    <title>Crear Cuenta - EduConnect</title>
    <link rel="icon" type="image/png" href="./imagenes/icono4.png">
</head>
<body>

    <div class="login">

        <form action="roles.html" method="GET">
            
            <div class="group">
                <label for="name">Nombre y Apellido</label>
                <input type="text" id="name" name="nombre" placeholder="Nombre y Apellido" required>    
            </div>

            <div class="group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="ejemplo@cen.edu.ar" required>
            </div>

            <div class="group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="••••••" required>        
            </div>

            <!-- Menú desplegable de roles -->
            <div class="group">
                <label for="role">Selecciona tu Rol</label>
                <select id="role" name="id_rol" required>
                    <option value="" disabled selected>-- Seleccionar Rol --</option>
                    <option value="1">Estudiante</option>
                    <option value="2">Profesor</option>
                    <option value="3">Preceptor</option>
                </select>
            </div>

            <button type="submit" class="btn-small">Registrarse</button>
            
            <p class="link-text">
                ¿Ya tienes una cuenta? <a href="iniciar_sesion.html" class="link">Inicia sesión aquí</a>
            </p>
            
        </form>

    </div>

</body>
</html>
