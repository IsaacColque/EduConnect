<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/crear_cuenta.css">
    
    <title>Crear Cuenta - EduConnect</title>
    <link rel="icon" type="image/png" href="./imagenes/icono4.png">

    <!-- 1. Cargar el cliente de Supabase por CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="login">

        <!-- Formulario controlado por JavaScript para validar Supabase -->
        <form id="formCrearCuenta">
            
            <div class="group">
                <label for="name">Nombre y Apellido</label>
                <input type="text" id="name" name="nombre" placeholder="Nombre y Apellido" required autocomplete="off">    
            </div>

            <div class="group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="ejemplo@cen.edu.ar" required autocomplete="off">
            </div>

            <div class="group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="••••••" required autocomplete="new-password">       
            </div>

            <!-- Menú desplegable de roles -->
            <div class="group">
                <label for="role">Selecciona tu Rol</label>
                <select id="role" name="rol" required>
                    <option value="" disabled selected>-- Seleccionar Rol --</option>
                    <option value="estudiante">Estudiante</option>
                    <option value="profesor">Profesor</option>
                    <option value="preceptor">Preceptor</option>
                </select>
            </div>

            <!-- Campos adicionales para Estudiante (Ocultos por defecto, uno al lado del otro) -->
            <div id="camposEstudiante" style="display: none; gap: 10px;">
                <div class="group" style="flex: 1;">
                    <label for="anio">Año</label>
                    <input type="text" id="anio" name="anio" placeholder="Ej: 5°">
                </div>
                <div class="group" style="flex: 1;">
                    <label for="division">División</label>
                    <input type="text" id="division" name="division" placeholder="Ej: 1°">
                </div>
            </div>

            <button type="submit" class="btn-small" id="btnRegistrar">Registrarse</button>
            
            <p class="link-text">
                ¿Ya tienes una cuenta? <a href="iniciar_sesion.html" class="link">Inicia sesión aquí</a>
            </p>
            
        </form>

    </div>

    <!-- 2. Lógica de interfaz dinámica y registro en Supabase -->
    <script>
        // Configuración de credenciales de Supabase
        const SUPABASE_URL = 'https://zlgbnzafupigoezbcsu.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_9Slr_t--WLGY6voRBemjjw_nMIRdISo';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const form = document.getElementById('formCrearCuenta');
        const roleSelect = document.getElementById('role');
        const camposEstudiante = document.getElementById('camposEstudiante');
        const anioInput = document.getElementById('anio');
        const divisionInput = document.getElementById('division');

        // Mostrar u ocultar campos de Año y División según el rol seleccionado
        roleSelect.addEventListener('change', function() {
            if (this.value === 'estudiante') {
                camposEstudiante.style.display = 'flex'; // Los muestra uno al lado del otro
                anioInput.required = true;
                divisionInput.required = true;
            } else {
                camposEstudiante.style.display = 'none'; // Los oculta
                anioInput.required = false;
                divisionInput.required = false;
                anioInput.value = '';
                divisionInput.value = '';
            }
        });

        // Enviar datos a Supabase al hacer submit
        form.addEventListener('submit', async function(event) {
            event.preventDefault();
            event.stopPropagation();

            const nombreCompleto = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const rol = roleSelect.value;
            const anio = anioInput.value.trim();
            const division = divisionInput.value.trim();

            // Separar Nombre y Apellido
            const partesNombre = nombreCompleto.split(' ');
            const nombre = partesNombre[0] || '';
            const apellido = partesNombre.slice(1).join(' ') || '';

            // Registrar usuario en Supabase Auth enviando también el año y división si es estudiante
            const { data, error } = await supabase.auth.signUp({
                email: email,
                password: password,
                options: {
                    data: {
                        nombre: nombre,
                        apellido: apellido,
                        rol: rol,
                        anio: rol === 'estudiante' ? anio : null,
                        division: rol === 'estudiante' ? division : null
                    }
                }
            });

            if (error) {
                alert('Error al registrarse: ' + error.message);
                return;
            }

            alert('¡Cuenta creada con éxito! Ahora puedes iniciar sesión.');
            window.location.href = 'iniciar_sesion.html';
        });
    </script>

</body>
</html>
